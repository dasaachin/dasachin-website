name: Import WordPress posts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/.import-wordpress']
permissions:
  contents: write
concurrency: content-sync
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-wordpress.mjs
      - name: Commit imported posts
        run: |
          git config user.name "Da Sachin Sharma"
          git config user.email "dasaachin@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Import posts from WordPress"
          git pull --rebase
          git push
